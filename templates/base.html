<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belarus Landmarks</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f4f7f6; color: #333; }
        header { background-color: #2c3e50; color: white; padding: 1rem; text-align: center; }
        nav { background: #34495e; padding: 0.5rem; text-align: center; }
        nav a { color: white; margin: 0 15px; text-decoration: none; font-weight: bold; }
        nav a:hover { color: #1abc9c; }
        .container { max-width: 1000px; margin: 30px auto; padding: 20px; background: white; box-shadow: 0 0 10px rgba(0,0,0,0.1); border-radius: 8px; }
        footer { text-align: center; padding: 20px; background: #2c3e50; color: white; margin-top: 40px; }
        h1, h2 { color: #2c3e50; }
        .btn { background: #1abc9c; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; }
        .btn:hover { background: #16a085; }
    </style>
</head>
<body>

<header>
    <h1>Travel Belarus</h1>
    <p>School project on the subject "English Language"</p>
</header>

<nav>
    <a href="{{ url_for('index') }}">Home</a>
    <a href="{{ url_for('volozhin') }}">Volozhin Region</a>
    <a href="{{ url_for('landmarks') }}">Famous Landmarks</a>
    <a href="{{ url_for('rate') }}">Site Rating</a> <!-- Добавили эту строку -->
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>

<footer>
    <p>&copy; 2026 Belarus Travel Guide | Created by Stoma Ekaterina, 8"A"</p>
</footer>

</body>
</html>
